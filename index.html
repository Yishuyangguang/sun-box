<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>一束阳光 - 口令传送与云盘</title>
  <!-- 可爱治愈系萌萌太阳 Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23f59e0b' stroke-width='4' stroke-linecap='round' stroke-dasharray='2 10'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23fbbf24'/%3E%3Ccircle cx='23' cy='35' r='2.8' fill='%23fb7185' opacity='0.75'/%3E%3Ccircle cx='41' cy='35' r='2.8' fill='%23fb7185' opacity='0.75'/%3E%3Ccircle cx='25' cy='29' r='2.3' fill='%231c1917'/%3E%3Ccircle cx='39' cy='29' r='2.3' fill='%231c1917'/%3E%3Ccircle cx='24.2' cy='28.2' r='0.8' fill='%23ffffff'/%3E%3Ccircle cx='38.2' cy='28.2' r='0.8' fill='%23ffffff'/%3E%3Cpath d='M28 33 Q32 37 36 33' stroke='%231c1917' stroke-width='1.8' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  
  <style>
    :root {
      --bg-ambient: #fffbeb;
      --text-main: #1c1917;
      --text-muted: #78716c;
      --danger: #ef4444;
      --success: #10b981;
      --theme-accent: #f59e0b;
      --theme-dark: #d97706;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-ambient);
      background-image: radial-gradient(circle at 10% 10%, #fef08a 0%, transparent 40%), radial-gradient(circle at 90% 90%, #fde68a 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 60px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    .glass {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.35);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04), inset 0 2px 2px rgba(255, 255, 255, 0.9);
      border-radius: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
    
    body:not(.admin-mode) .admin-only { display: none !important; }
    body.admin-mode .guest-only { display: none !important; }

    .header {
      padding: 14px 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed rgba(245, 158, 11, 0.35);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    @keyframes sunFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(4deg); } }
    .logo-icon-svg {
      width: 44px; height: 44px;
      animation: sunFloat 3.5s infinite ease-in-out;
      filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.4));
    }
    .logo-text { font-size: 22px; font-weight: 800; color: #1c1917; letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav-link {
      padding: 8px 16px;
      border-radius: 20px;
      color: #b45309;
      font-size: 13.5px;
      font-weight: 700;
      border: 1px solid rgba(245, 158, 11, 0.35);
      background: rgba(255, 255, 255, 0.85);
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.1);
    }
    .nav-link:hover {
      background: #f59e0b;
      color: #fff;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
      transform: translateY(-1px);
    }

    .pickup-box {
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 25px;
    }
    .pickup-title { font-size: 20px; font-weight: 800; color: #b45309; margin-bottom: 8px; }
    .pickup-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .pickup-input-group {
      max-width: 480px;
      margin: 0 auto 15px auto;
      display: flex;
      gap: 10px;
    }
    .pickup-input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 16px;
      border: 2px solid rgba(245, 158, 11, 0.4);
      outline: none;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.95);
      color: #1c1917;
      transition: 0.2s;
    }
    .pickup-input:focus { border-color: #f59e0b; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2); }
    .pickup-btn {
      padding: 0 26px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
      transition: 0.2s;
    }
    .pickup-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

    #pickupResultArea { display: none; margin-top: 20px; text-align: left; }
    .result-card {
      padding: 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .result-text-content {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14.5px;
      line-height: 1.6;
      background: #fffbeb;
      padding: 14px;
      border-radius: 10px;
      border: 1px dashed rgba(245, 158, 11, 0.4);
      margin: 12px 0;
      max-height: 300px;
      overflow-y: auto;
    }

    .section-tab-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(245, 158, 11, 0.2);
      padding-bottom: 10px;
    }
    .tab-item-btn {
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      color: #b45309;
      background: rgba(245, 158, 11, 0.12);
      transition: 0.2s;
    }
    .tab-item-btn.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
    }
    .storage-widget {
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #b45309;
    }
    .storage-bar-bg {
      width: 100%;
      max-width: 250px;
      height: 8px;
      background: rgba(245, 158, 11, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }
    .storage-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      width: 0%;
      transition: width 0.4s ease;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      padding: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      background: rgba(255, 250, 235, 0.85);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90px;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(245, 158, 11, 0.15);
      background: #fff;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #1c1917;
      padding-right: 40px;
      word-break: break-all;
      font-size: 14.5px;
    }
    .card-icon {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.15);
      flex-shrink: 0;
    }
    .card-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 10px; display: flex; justify-content: space-between; }
    .glass-icon-btn-group { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 10; }
    .btn-icon-3d {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      cursor: pointer;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(245, 158, 11, 0.3);
      transition: 0.15s;
    }
    .btn-icon-3d:hover { transform: scale(1.1); }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none; justify-content: center; align-items: center;
      z-index: 2000; opacity: 0; transition: opacity 0.2s ease;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-card { width: 100%; max-width: 440px; padding: 26px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-label { display: block; font-size: 12.5px; font-weight: 700; color: #b45309; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      color: var(--text-main);
      outline: none;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 12px;
      transition: 0.2s;
    }
    .form-control:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }
    .btn-submit {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      font-weight: 700;
      font-size: 14.5px;
      transition: 0.2s;
    }
    .btn-submit:hover { filter: brightness(1.08); transform: translateY(-1px); }

    #transfer-toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 3000;
      width: 320px; padding: 16px 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(245, 158, 11, 0.25);
      transform: translateY(120px); opacity: 0; transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #transfer-toast.show { transform: translateY(0); opacity: 1; }
    .transfer-bar-bg { width: 100%; height: 7px; background: rgba(245, 158, 11, 0.2); border-radius: 10px; overflow: hidden; margin: 8px 0; }
    .transfer-bar-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #3b82f6); width: 0%; transition: width 0.1s linear; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="logo-area">
        <svg class="logo-icon-svg" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="27" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
          <circle cx="32" cy="32" r="19" fill="#fbbf24"/>
          <circle cx="23" cy="35" r="2.8" fill="#fb7185" opacity="0.75"/>
          <circle cx="41" cy="35" r="2.8" fill="#fb7185" opacity="0.75"/>
          <circle cx="25" cy="29" r="2.3" fill="#1c1917"/>
          <circle cx="39" cy="29" r="2.3" fill="#1c1917"/>
          <circle cx="24.2" cy="28.2" r="0.8" fill="#ffffff"/>
          <circle cx="38.2" cy="28.2" r="0.8" fill="#ffffff"/>
          <path d="M28 33 Q32 37 36 33" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </svg>
        <div class="logo-text">一束阳光 <span style="color:var(--theme-accent);font-size:14px;font-weight:700;">传送箱</span></div>
      </div>
      <div class="header-actions">
        <button class="nav-link glass" onclick="openSendModal()" style="background: rgba(245, 158, 11, 0.15); border-color: #f59e0b;">📤 我要发件</button>
        <button class="nav-link glass guest-only" onclick="showModal('loginModal')">👤 管理员登入</button>
        <button class="nav-link glass admin-only" onclick="document.getElementById('cloudUploadInput').click()" style="background:#f59e0b; color:#fff;">📤 存入云盘</button>
        <button class="nav-link glass admin-only" onclick="logout()" style="color:var(--danger); border-color:rgba(239,68,68,0.3);">🔓 退出</button>
        <input type="file" id="cloudUploadInput" multiple style="display: none;" onchange="handleCloudUpload(event)">
      </div>
    </header>

    <!-- 📦 核心取件箱 -->
    <div class="pickup-box glass">
      <div class="pickup-title">📦 阳光文件快递柜</div>
      <div class="pickup-subtitle">输入 5 位取件码，极速提取加密便签或云端文件</div>
      <div class="pickup-input-group">
        <input type="text" id="pickupCodeInput" class="pickup-input" placeholder="输入5位取件码" maxlength="6" autocomplete="off" onkeypress="if(event.key==='Enter') executePickup()">
        <button class="pickup-btn" onclick="executePickup()">✨ 提取</button>
      </div>

      <div id="pickupResultArea">
        <div class="result-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span id="resultTypeBadge" style="font-size:12px; font-weight:800; color:#b45309; padding:3px 8px; border-radius:6px; background:rgba(245,158,11,0.15);">📄 文件附件</span>
            <span id="resultExpireBadge" style="font-size:11.5px; color:var(--text-muted);">⏳ 有效期至：--</span>
          </div>
          <h3 id="resultTitle" style="font-size:16px; font-weight:800; margin-bottom:4px;">--</h3>
          <div id="resultTextWrap" style="display: none;">
            <div id="resultTextContent" class="result-text-content"></div>
            <button class="btn-submit" onclick="copyResultText()" style="padding: 10px; font-size: 13px;">📋 一键复制文本内容</button>
          </div>
          <div id="resultFileWrap" style="display: none; margin-top: 12px;">
            <div style="font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px;" id="resultFileSize">文件体积：0 MB</div>
            <button id="resultDownloadBtn" class="btn-submit" style="padding: 11px;">⬇️ 立即高速下载文件</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 💾 管理员专属看板 -->
    <div class="admin-only">
      <div class="section-tab-bar">
        <button class="tab-item-btn active" id="tabBtnPan" onclick="switchAdminTab('pan')">📁 云盘文件库</button>
        <button class="tab-item-btn" id="tabBtnBox" onclick="switchAdminTab('box')">📦 快递柜中枢</button>
      </div>

      <div id="adminPanView">
        <div id="storageWidget" class="storage-widget glass">
          <div>
            💾 本桶存储占用：<span id="storageUsedText" style="color:#1c1917; font-weight:800;">计算中...</span>
            <span style="font-size:11px; color:var(--text-muted); margin-left:6px;" id="storageCountText"></span>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="storage-bar-bg"><div id="storageBarFill" class="storage-bar-fill"></div></div>
            <span id="storagePercentText" style="font-size:12px; font-weight:700;">0%</span>
          </div>
        </div>
        <div id="fileGrid" class="grid"><p style="color:var(--text-muted); padding:20px;">🔄 正在加载资料库...</p></div>
      </div>

      <div id="adminBoxView" style="display:none;">
        <div class="glass" style="padding: 20px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="font-size:15px; font-weight:800; color:#b45309;">活跃取件码监控清单</h3>
            <button class="nav-link" onclick="loadAdminBoxList()" style="padding:4px 12px; font-size:12px;">🔄 刷新列表</button>
          </div>
          <div id="boxListContainer" style="display:flex; flex-direction:column; gap:10px;">
            <p style="color:var(--text-muted); font-size:13px;">加载中...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 📤 弹窗：圈子发件箱 -->
  <div id="sendModal" class="modal-overlay">
    <div class="modal-card glass">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:16px; font-weight:800; color:#b45309;">📤 阳光圈子发件箱</h3>
        <button onclick="closeModal('sendModal')" style="font-size:18px; color:var(--text-muted);">&times;</button>
      </div>
      <div class="form-group">
        <label class="form-label">🔑 圈子授权口令</label>
        <input type="password" id="sendAuthKey" class="form-control" placeholder="请输入圈子发件口令">
      </div>
      <div class="section-tab-bar" style="margin-bottom: 14px;">
        <button class="tab-item-btn active" id="sendTabFile" onclick="switchSendType('file')">📄 发文件</button>
        <button class="tab-item-btn" id="sendTabText" onclick="switchSendType('text')">📝 发便签</button>
      </div>

      <div id="sendFormFile">
        <div class="form-group">
          <label class="form-label">选择文件 (支持最大 200MB+)</label>
          <input type="file" id="sendFileInput" class="form-control">
        </div>
      </div>

      <div id="sendFormText" style="display: none;">
        <div class="form-group">
          <label class="form-label">便签标题 (可选)</label>
          <input type="text" id="sendTextTitle" class="form-control" placeholder="例如：服务器临时账号">
        </div>
        <div class="form-group">
          <label class="form-label">文本内容</label>
          <textarea id="sendTextContent" class="form-control" style="height: 100px; resize: none;" placeholder="在此粘贴需要分享的文本或代码..."></textarea>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">⏳ 有效期设置</label>
        <select id="sendExpireTime" class="form-control">
          <option value="1">1 小时后销毁</option>
          <option value="24" selected>1 天后自动清理</option>
          <option value="72">3 天后清理</option>
          <option value="168">7 天后清理</option>
          <option value="0">🔒 永久储存</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">💣 销毁策略</label>
        <select id="sendMaxDownloads" class="form-control">
          <option value="0">不限下载/查阅次数</option>
          <option value="1">阅后即焚 (提取 1 次后物理销毁)</option>
          <option value="3">限 3 次提取</option>
        </select>
      </div>

      <button class="btn-submit" onclick="submitSendBox()">🚀 生成专属取件码</button>
    </div>
  </div>

  <!-- 👤 弹窗：管理员登入 -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card glass" style="text-align: center;">
      <div style="font-size: 38px; margin-bottom: 8px;">👤</div>
      <div style="font-size: 16px; font-weight: 800; margin-bottom: 16px;">管理员身份认证</div>
      <input type="password" id="loginPwd" class="form-control" placeholder="请输入管理员密钥" onkeypress="if(event.key==='Enter') login()">
      <button class="btn-submit" style="margin-top: 10px;" onclick="login()">验证登入</button>
      <button class="btn-submit" style="background:transparent; color:var(--text-muted); border:1px solid rgba(245,158,11,0.3); margin-top:8px;" onclick="closeModal('loginModal')">取消</button>
    </div>
  </div>

  <!-- 传输进度 Toast -->
  <div id="transfer-toast">
    <div style="font-size:12px; font-weight:700; display:flex; justify-content:space-between;">
      <span id="transferTaskName">🚀 准备传输...</span>
      <span id="transferPercent">0%</span>
    </div>
    <div class="transfer-bar-bg"><div id="transferBarFill" class="transfer-bar-fill"></div></div>
    <div style="font-size:11px; color:var(--text-muted); display:flex; justify-content:space-between;">
      <span id="transferSpeed">⚡ 0 KB/s</span>
      <span id="transferSize">0 MB / 0 MB</span>
    </div>
  </div>

  <script>
    const API_URL = "";
    let currentFileList = [];
    let currentSendType = "file";

    function getAdminPwd() { return sessionStorage.getItem('panAdminKey') || ""; }
    function getSendPwd() { return localStorage.getItem('panSendKey') || ""; }
    function checkAuth() {
      if (getAdminPwd()) {
        document.body.classList.add('admin-mode');
        loadStorageStats();
        loadFiles();
      } else {
        document.body.classList.remove('admin-mode');
      }
    }
    function logout() { sessionStorage.removeItem('panAdminKey'); checkAuth(); }
    function showModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function login() {
      const pwd = document.getElementById('loginPwd').value.trim();
      if (!pwd) return;
      sessionStorage.setItem('panAdminKey', pwd);
      checkAuth();
      closeModal('loginModal');
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function copyCode(code) {
      navigator.clipboard.writeText(code).then(() => {
        alert(`📋 取件码【${code}】已成功复制！`);
      }).catch(() => {
        prompt("请手动复制取件码：", code);
      });
    }

    async function executePickup(forcedCode) {
      const code = (forcedCode || document.getElementById('pickupCodeInput').value).trim().toUpperCase();
      if (!code) { alert("⚠️ 请输入 5 位取件码！"); return; }
      document.getElementById('pickupCodeInput').value = code;

      const resultArea = document.getElementById('pickupResultArea');
      const titleEl = document.getElementById('resultTitle');
      const typeBadge = document.getElementById('resultTypeBadge');
      const expireBadge = document.getElementById('resultExpireBadge');
      const textWrap = document.getElementById('resultTextWrap');
      const textContent = document.getElementById('resultTextContent');
      const fileWrap = document.getElementById('resultFileWrap');
      const fileSizeEl = document.getElementById('resultFileSize');
      const dlBtn = document.getElementById('resultDownloadBtn');

      try {
        const res = await fetch(`${API_URL}/api/box/get?code=${encodeURIComponent(code)}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error || "取件码不存在或已过期销毁");

        const data = json.data;
        resultArea.style.display = 'block';
        titleEl.innerText = data.name || "口令便签";
        expireBadge.innerText = data.expireAt ? `⏳ 过期时间：${new Date(data.expireAt).toLocaleString()}` : "🔒 永久保存";

        if (data.type === 'text') {
          typeBadge.innerText = "📝 纯文本便签";
          textWrap.style.display = 'block';
          fileWrap.style.display = 'none';
          textContent.innerText = data.text;
        } else {
          typeBadge.innerText = "📄 文件附件";
          textWrap.style.display = 'none';
          fileWrap.style.display = 'block';
          fileSizeEl.innerText = `文件体积：${formatBytes(data.size)}`;
          dlBtn.onclick = () => { window.location.href = `${API_URL}/api/download?key=${encodeURIComponent(data.r2Key)}&boxCode=${code}`; };
        }
      } catch (e) {
        alert("❌ " + e.message);
        resultArea.style.display = 'none';
      }
    }

    function copyResultText() {
      const text = document.getElementById('resultTextContent').innerText;
      navigator.clipboard.writeText(text).then(() => alert("📋 文本内容已成功复制！"));
    }

    function openSendModal() {
      document.getElementById('sendAuthKey').value = getSendPwd();
      showModal('sendModal');
    }

    function switchSendType(type) {
      currentSendType = type;
      document.getElementById('sendTabFile').classList.toggle('active', type === 'file');
      document.getElementById('sendTabText').classList.toggle('active', type === 'text');
      document.getElementById('sendFormFile').style.display = type === 'file' ? 'block' : 'none';
      document.getElementById('sendFormText').style.display = type === 'text' ? 'block' : 'none';
    }

    async function submitSendBox() {
      const sendKey = document.getElementById('sendAuthKey').value.trim();
      if (!sendKey) { alert("⚠️ 请输入圈子发件口令！"); return; }
      localStorage.setItem('panSendKey', sendKey);

      const expireHours = parseInt(document.getElementById('sendExpireTime').value);
      const maxDownloads = parseInt(document.getElementById('sendMaxDownloads').value);

      if (currentSendType === 'text') {
        const title = document.getElementById('sendTextTitle').value.trim() || '未命名便签';
        const content = document.getElementById('sendTextContent').value.trim();
        if (!content) { alert("⚠️ 请输入便签内容！"); return; }

        const res = await fetch(`${API_URL}/api/box/create`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-send-auth": sendKey },
          body: JSON.stringify({ type: 'text', name: title, text: content, expireHours, maxDownloads })
        });
        const json = await res.json();
        if (!json.success) { alert("❌ " + json.error); return; }
        prompt("🎉 便签创建成功！专属 5 位取件码：", json.code);
        closeModal('sendModal');
      } else {
        const fileInput = document.getElementById('sendFileInput');
        if (!fileInput.files.length) { alert("⚠️ 请选择文件！"); return; }
        const file = fileInput.files[0];

        closeModal('sendModal');
        await uploadLargeBoxFile(file, expireHours, maxDownloads, sendKey);
      }
    }

    async function uploadLargeBoxFile(file, expireHours, maxDownloads, sendKey) {
      const toast = document.getElementById('transfer-toast');
      const taskName = document.getElementById('transferTaskName');
      const percentText = document.getElementById('transferPercent');
      const barFill = document.getElementById('transferBarFill');
      const speedText = document.getElementById('transferSpeed');
      const sizeText = document.getElementById('transferSize');
      toast.classList.add('show');

      taskName.innerText = `📤 分片传送: ${file.name}`;
      const CHUNK_SIZE = 10 * 1024 * 1024;
      const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

      const initRes = await fetch(`${API_URL}/api/box/init-multipart`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-send-auth": sendKey },
        body: JSON.stringify({ filename: file.name, size: file.size, expireHours, maxDownloads })
      });
      const initJson = await initRes.json();
      if (!initJson.success) { alert("❌ 上传失败：" + initJson.error); toast.classList.remove('show'); return; }

      const { uploadId, r2Key, code } = initJson;
      const uploadedParts = [];
      let lastLoaded = 0, lastTime = Date.now();

      for (let i = 0; i < totalChunks; i++) {
        const start = i * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, file.size);
        const chunkBlob = file.slice(start, end);
        const partNumber = i + 1;

        const partRes = await fetch(`${API_URL}/api/box/upload-part?r2Key=${encodeURIComponent(r2Key)}&uploadId=${uploadId}&partNumber=${partNumber}`, {
          method: "POST",
          headers: { "x-send-auth": sendKey },
          body: chunkBlob
        });
        const partJson = await partRes.json();
        if (!partJson.success) { alert("❌ 分片传输中断"); toast.classList.remove('show'); return; }
        uploadedParts.push({ partNumber, etag: partJson.etag });

        const currentLoaded = end;
        const now = Date.now();
        const diff = (now - lastTime) / 1000;
        if (diff >= 0.2) {
          const speed = (currentLoaded - lastLoaded) / diff;
          speedText.innerText = `⚡ ${formatBytes(speed)}/s`;
          lastLoaded = currentLoaded;
          lastTime = now;
        }
        const percent = Math.floor((currentLoaded / file.size) * 100);
        percentText.innerText = `${percent}%`;
        barFill.style.width = `${percent}%`;
        sizeText.innerText = `${formatBytes(currentLoaded)} / ${formatBytes(file.size)}`;
      }

      await fetch(`${API_URL}/api/box/complete-multipart`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-send-auth": sendKey },
        body: JSON.stringify({ r2Key, uploadId, parts: uploadedParts, code })
      });

      percentText.innerText = `100%`;
      barFill.style.width = `100%`;
      speedText.innerText = `✅ 发送成功！`;
      setTimeout(() => toast.classList.remove('show'), 2000);
      prompt("🎉 文件已成功存入快递柜！取件码：", code);
    }

    function switchAdminTab(tab) {
      document.getElementById('tabBtnPan').classList.toggle('active', tab === 'pan');
      document.getElementById('tabBtnBox').classList.toggle('active', tab === 'box');
      document.getElementById('adminPanView').style.display = tab === 'pan' ? 'block' : 'none';
      document.getElementById('adminBoxView').style.display = tab === 'box' ? 'block' : 'none';
      if (tab === 'box') loadAdminBoxList();
    }

    async function loadStorageStats() {
      if (!getAdminPwd()) return;
      try {
        const res = await fetch(`${API_URL}/api/stats`, { headers: { "x-custom-auth": getAdminPwd() } });
        const json = await res.json();
        if (json.success) {
          const bytes = json.totalBytes;
          const limit = 10 * 1024 * 1024 * 1024;
          const percent = Math.min((bytes / limit) * 100, 100).toFixed(1);
          document.getElementById('storageUsedText').innerText = `${formatBytes(bytes)} / 10 GB`;
          document.getElementById('storageCountText').innerText = `(${json.totalCount} 个资料)`;
          document.getElementById('storageBarFill').style.width = `${percent}%`;
          document.getElementById('storagePercentText').innerText = `${percent}%`;
        }
      } catch (e) {}
    }

    async function loadFiles() {
      const grid = document.getElementById('fileGrid');
      try {
        const res = await fetch(`${API_URL}/api/list`, { headers: { "x-custom-auth": getAdminPwd() } });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        currentFileList = json.data;
        renderGridCards();
      } catch (e) {
        grid.innerHTML = `<p style="color:var(--danger); padding:20px;">❌ 加载失败: ${e.message}</p>`;
      }
    }

    function renderGridCards() {
      const grid = document.getElementById('fileGrid');
      if (currentFileList.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted); padding:20px;">📂 云盘内暂无文件，点击右上角存入云盘吧 ~</p>';
        return;
      }
      let html = '';
      currentFileList.forEach((item) => {
        html += `
          <div class="card glass">
            <div class="glass-icon-btn-group">
              <button class="btn-icon-3d" style="color:var(--danger);" onclick="event.stopPropagation(); deleteCloudItem('${item.key}')" title="彻底删除">🗑️</button>
            </div>
            <div style="flex: 1;" onclick="window.location.href='${API_URL}/api/download?key=${encodeURIComponent(item.key)}'">
              <div class="card-header"><span class="card-icon">📄</span><span>${item.name}</span></div>
            </div>
            <div class="card-meta"><span>${formatBytes(item.size)}</span><span>${item.uploadTime ? new Date(item.uploadTime).toLocaleDateString() : ''}</span></div>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    async function deleteCloudItem(key) {
      if (!confirm("⚠️ 确定要彻底删除该文件吗？")) return;
      await fetch(`${API_URL}/api/delete`, {
        method: "POST",
        headers: { "x-custom-auth": getAdminPwd(), "Content-Type": "application/json" },
        body: JSON.stringify({ key })
      });
      loadFiles();
      loadStorageStats();
    }

    async function handleCloudUpload(e) {
      const files = e.target.files;
      if (!files.length || !getAdminPwd()) return;

      const toast = document.getElementById('transfer-toast');
      const taskName = document.getElementById('transferTaskName');
      const percentText = document.getElementById('transferPercent');
      const barFill = document.getElementById('transferBarFill');
      const speedText = document.getElementById('transferSpeed');
      const sizeText = document.getElementById('transferSize');
      toast.classList.add('show');

      const CHUNK_SIZE = 10 * 1024 * 1024;

      for (let f = 0; f < files.length; f++) {
        const file = files[f];
        const r2Key = `pan/${file.name}`;
        taskName.innerText = `📤 存入云盘 (${f+1}/${files.length}): ${file.name}`;
        percentText.innerText = `0%`;
        barFill.style.width = `0%`;

        const initRes = await fetch(`${API_URL}/api/pan/init-multipart`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-custom-auth": getAdminPwd() },
          body: JSON.stringify({ r2Key })
        });
        const initJson = await initRes.json();
        if (!initJson.success) {
          alert(`❌ 文件 ${file.name} 初始化失败: ` + initJson.error);
          continue;
        }

        const { uploadId } = initJson;
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        const uploadedParts = [];
        let lastLoaded = 0, lastTime = Date.now();

        for (let i = 0; i < totalChunks; i++) {
          const start = i * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, file.size);
          const chunkBlob = file.slice(start, end);
          const partNumber = i + 1;

          const partRes = await fetch(`${API_URL}/api/box/upload-part?r2Key=${encodeURIComponent(r2Key)}&uploadId=${uploadId}&partNumber=${partNumber}`, {
            method: "POST",
            headers: { "x-custom-auth": getAdminPwd() },
            body: chunkBlob
          });
          const partJson = await partRes.json();
          if (!partJson.success) {
            alert("❌ 上传中断");
            toast.classList.remove('show');
            return;
          }
          uploadedParts.push({ partNumber, etag: partJson.etag });

          const currentLoaded = end;
          const now = Date.now();
          const diff = (now - lastTime) / 1000;
          if (diff >= 0.2) {
            const speed = (currentLoaded - lastLoaded) / diff;
            speedText.innerText = `⚡ ${formatBytes(speed)}/s`;
            lastLoaded = currentLoaded;
            lastTime = now;
          }
          const percent = Math.floor((currentLoaded / file.size) * 100);
          percentText.innerText = `${percent}%`;
          barFill.style.width = `${percent}%`;
          sizeText.innerText = `${formatBytes(currentLoaded)} / ${formatBytes(file.size)}`;
        }

        await fetch(`${API_URL}/api/pan/complete-multipart`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-custom-auth": getAdminPwd() },
          body: JSON.stringify({ r2Key, uploadId, parts: uploadedParts })
        });
      }

      percentText.innerText = `100%`;
      barFill.style.width = `100%`;
      speedText.innerText = `✅ 全部资料已存入云盘！`;
      setTimeout(() => toast.classList.remove('show'), 2000);

      e.target.value = "";
      loadFiles();
      loadStorageStats();
    }

    async function loadAdminBoxList() {
      const container = document.getElementById('boxListContainer');
      try {
        const res = await fetch(`${API_URL}/api/box/admin-list`, { headers: { "x-custom-auth": getAdminPwd() } });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        if (json.data.length === 0) { container.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">当前没有活跃的取件码记录。</p>'; return; }
        let html = '';
        json.data.forEach(item => {
          html += `
            <div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:12px 14px; border-radius:12px; border:1px solid rgba(245,158,11,0.25); box-shadow:0 2px 6px rgba(245,158,11,0.06);">
              <div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span onclick="copyCode('${item.code}')" style="cursor:pointer; font-weight:800; color:#b45309; font-size:16px; background:rgba(245,158,11,0.15); padding:2px 8px; border-radius:6px; border:1px dashed rgba(245,158,11,0.5); transition:0.2s;" title="👉 点击直接复制取件码">
                    📋 ${item.code}
                  </span>
                  <span style="font-size:14px; font-weight:700; color:#1c1917;">${item.name}</span>
                </div>
                <div style="font-size:11.5px; color:var(--text-muted); margin-top:5px;">
                  类型: ${item.type} | 体积: ${formatBytes(item.size)} | 剩余下载: ${item.maxDownloads > 0 ? (item.maxDownloads - item.downloadCount) : '不限'}
                </div>
              </div>
              <button class="nav-link" style="color:var(--danger); border-color:rgba(239,68,68,0.3); font-size:12px; padding:5px 10px;" onclick="deleteBoxCode('${item.code}')">销毁</button>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (e) { container.innerHTML = `<p style="color:var(--danger);">${e.message}</p>`; }
    }

    async function deleteBoxCode(code) {
      if (!confirm(`确定要提前强制销毁取件码【${code}】吗？`)) return;
      await fetch(`${API_URL}/api/box/admin-delete`, {
        method: "POST",
        headers: { "x-custom-auth": getAdminPwd(), "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      });
      loadAdminBoxList();
      loadStorageStats();
    }

    // 页面加载完成初始化（支持 URL 链接直接提取）
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      const urlParams = new URLSearchParams(window.location.search);
      const urlCode = urlParams.get('code') || window.location.hash.replace('#', '');
      if (urlCode && urlCode.length >= 4) {
        executePickup(urlCode);
      }
    });
  </script>
</body>
</html>
