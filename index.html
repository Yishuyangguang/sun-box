<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>阳光快递柜</title>
  
  <!-- 🚀 网络预连接加速 -->
  <link rel="dns-prefetch" href="//dash.cloudflare.com">
  <link rel="preconnect" href="/" crossorigin>

  <!-- 萌系太阳 Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23f59e0b' stroke-width='4' stroke-linecap='round' stroke-dasharray='2 10'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23fbbf24'/%3E%3Ccircle cx='23' cy='35' r='2.8' fill='%23fb7185' opacity='0.75'/%3E%3Ccircle cx='41' cy='35' r='2.8' fill='%23fb7185' opacity='0.75'/%3E%3Ccircle cx='25' cy='29' r='2.3' fill='%231c1917'/%3E%3Ccircle cx='39' cy='29' r='2.3' fill='%231c1917'/%3E%3Ccircle cx='24.2' cy='28.2' r='0.8' fill='%23ffffff'/%3E%3Ccircle cx='38.2' cy='28.2' r='0.8' fill='%23ffffff'/%3E%3Cpath d='M28 33 Q32 37 36 33' stroke='%231c1917' stroke-width='1.8' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #eff6ff 0%, #fef3c7 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #d946ef 100%);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }

    /* 主卡片容器 */
    .app-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px 26px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    /* 顶部标题 */
    .title-area {
      text-align: center;
      margin-bottom: 22px;
    }
    .title-area h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #4338ca, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 顶部分段切换开关 */
    .tab-switch {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #334155;
      transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-btn.active {
      background: #4f46e5;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    /* 拖拽上传区域 */
    .drop-zone {
      width: 100%;
      height: 180px;
      border: 2px dashed rgba(99, 102, 241, 0.7);
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 18px;
      padding: 16px;
      text-align: center;
    }
    .drop-zone.dragover {
      background: rgba(238, 242, 255, 0.95);
      border-color: #4f46e5;
      transform: scale(1.01);
    }
    .drop-icon {
      width: 52px;
      height: 52px;
      margin-bottom: 10px;
      color: #4f46e5;
    }
    .drop-text {
      font-size: 14.5px;
      font-weight: 700;
      color: #4338ca;
      margin-bottom: 4px;
    }
    .drop-sub {
      font-size: 12px;
      color: #94a3b8;
    }

    /* 已选文件卡片 */
    .selected-file-card {
      display: none;
      width: 100%;
      background: #eef2ff;
      border: 1.5px solid #c7d2fe;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 18px;
      align-items: center;
      justify-content: space-between;
    }
    .file-name-text {
      font-size: 13.5px;
      font-weight: 700;
      color: #3730a3;
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 文本输入框 */
    .text-input-area {
      display: none;
      width: 100%;
      height: 180px;
      border: 1.5px solid #cbd5e1;
      border-radius: 16px;
      padding: 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      resize: none;
      background: rgba(255, 255, 255, 0.9);
      margin-bottom: 18px;
      transition: 0.2s;
    }
    .text-input-area:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    /* 表单组 */
    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      background: #fff;
      outline: none;
      transition: 0.2s;
    }
    .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .expire-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 安全寄送按钮 */
    .btn-send {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: var(--primary-gradient);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(217, 70, 239, 0.3);
      transition: 0.2s ease;
      margin-top: 10px;
    }
    .btn-send:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    /* 底部切换栏 */
    .bottom-bar-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 22px;
    }
    .footer-toggle-link {
      font-size: 15.5px;
      font-weight: 800;
      color: #4f46e5;
      cursor: pointer;
      transition: 0.2s;
    }
    .footer-toggle-link:hover {
      text-decoration: underline;
      color: #3730a3;
      transform: translateY(-1px);
    }
    .history-link-btn {
      font-size: 13.5px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: 0.2s;
    }
    .history-link-btn:hover {
      color: #4f46e5;
      text-decoration: underline;
    }

    /* 取件视图 */
    #pickupView { display: none; }
    .pickup-input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 2px solid #6366f1;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 4px;
      text-transform: uppercase;
      outline: none;
      margin-bottom: 16px;
      background: #fff;
    }
    .pickup-result-card {
      display: none;
      margin-top: 16px;
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      text-align: left;
    }
    .result-memo-title {
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 10px;
    }
    .result-memo-content {
      font-size: 16.5px;
      font-weight: 500;
      line-height: 1.7;
      color: #0f172a;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 📜 发件记录模态卡片 (强化防溢出与大容量设计) */
    .history-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none; justify-content: center; align-items: center;
      z-index: 2000; opacity: 0; transition: opacity 0.2s ease;
      padding: 16px;
    }
    .history-modal-overlay.active { display: flex; opacity: 1; }
    .history-card {
      width: 100%; max-width: 460px;
      max-height: 82vh;
      background: #fff;
      border-radius: 22px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      position: relative;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    .history-search-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }
    .history-list-box {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }
    .history-list-box::-webkit-scrollbar {
      width: 5px;
    }
    .history-list-box::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    .history-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s ease;
    }
    .history-item:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .history-code-tag {
      font-size: 14px;
      font-weight: 800;
      color: #4f46e5;
      background: #eef2ff;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px dashed #6366f1;
      transition: 0.15s;
    }
    .history-code-tag:hover {
      background: #4f46e5;
      color: #fff;
    }
    .btn-delete-single {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      transition: 0.15s;
    }
    .btn-delete-single:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    /* 传输进度 Toast */
    #transfer-toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 3000;
      width: 310px; padding: 14px 18px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      transform: translateY(120px); opacity: 0; transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #transfer-toast.show { transform: translateY(0); opacity: 1; }
    .transfer-bar-bg { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin: 8px 0; }
    .transfer-bar-fill { height: 100%; background: var(--primary-gradient); width: 0%; transition: width 0.1s linear; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="title-area">
      <h1>☀️ 阳光文件快递柜</h1>
    </div>

    <!-- ================= 📤 寄件视图 ================= -->
    <div id="sendView">
      <div class="tab-switch">
        <button class="tab-btn active" id="tabSendFile" onclick="switchSendTab('file')">发送文件</button>
        <button class="tab-btn" id="tabSendText" onclick="switchSendTab('text')">发送文本</button>
      </div>

      <!-- 拖拽上传区域 -->
      <div id="fileAreaWrap">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('hiddenFileInput').click()">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
            <path d="M12 12v6"/>
            <path d="m15 15-3-3-3 3"/>
          </svg>
          <div class="drop-text">点击或拖放文件到此处上传</div>
          <div class="drop-sub">支持各种常见格式，最大200MB</div>
          <input type="file" id="hiddenFileInput" style="display: none;" onchange="handleFileSelected(event)">
        </div>

        <div class="selected-file-card" id="selectedFileCard">
          <div>
            <div class="file-name-text" id="selectedFileName">--</div>
            <div style="font-size: 11.5px; color:#64748b;" id="selectedFileSize">0 MB</div>
          </div>
          <button style="color:var(--danger); font-size:12.5px; font-weight:700;" onclick="clearSelectedFile()">✕ 移除</button>
        </div>
      </div>

      <!-- 文本输入框 -->
      <textarea id="textInputArea" class="text-input-area" placeholder="在此输入要发送的文本..."></textarea>

      <!-- 过期方式联动 -->
      <div class="form-group">
        <label class="form-label">过期方式</label>
        <div class="expire-row">
          <select id="expireUnitSelect" class="form-control" onchange="handleExpireUnitChange()">
            <option value="day" selected>天</option>
            <option value="hour">小时</option>
            <option value="count">提取次数 (阅后即焚)</option>
            <option value="forever">🔒 永久储存</option>
          </select>
          <div id="expireValueInputWrap" style="position: relative;">
            <input type="number" id="expireValueInput" class="form-control" value="1" min="1" max="999">
            <span id="expireUnitSuffix" style="position: absolute; right: 14px; top: 12px; font-size: 14px; font-weight: 700; color:#64748b;">天</span>
          </div>
        </div>
      </div>

      <!-- 授权口令 -->
      <div class="form-group">
        <input type="password" id="sendAuthKey" class="form-control" placeholder="请输入发件授权口令">
      </div>

      <!-- 安全寄送按钮 -->
      <button class="btn-send" onclick="submitSendBox()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
        </svg>
        安全寄送
      </button>

      <!-- 底部切换栏 -->
      <div class="bottom-bar-actions">
        <div class="footer-toggle-link" onclick="toggleView('pickup')">需要取件？点击这里</div>
        <span style="color:#cbd5e1;">|</span>
        <div class="history-link-btn" onclick="openHistoryModal()">📜 发件记录</div>
      </div>
    </div>

    <!-- ================= 📦 取件视图 ================= -->
    <div id="pickupView">
      <div style="text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 16px;">
        输入 5 位取件码，三网极速提取文件或便签
      </div>
      <input type="text" id="pickupCodeInput" class="pickup-input" placeholder="输入5位取件码" maxlength="6" autocomplete="off" onkeypress="if(event.key==='Enter') executePickup()">
      <button class="btn-send" style="background: linear-gradient(135deg, #4f46e5, #6366f1); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);" onclick="executePickup()">
        ✨ 立即提取
      </button>

      <!-- 取件结果区 -->
      <div class="pickup-result-card" id="pickupResultArea">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span id="resultTypeBadge" style="font-size:12px; font-weight:800; color:#4338ca; background:#e0e7ff; padding:2px 8px; border-radius:6px;">文件附件</span>
          <span id="resultExpireBadge" style="font-size:11.5px; color:#64748b;">有效期至：--</span>
        </div>
        
        <div class="result-memo-title" id="resultTitle">口令便签</div>
        <div id="resultTextWrap" style="display:none;" class="result-memo-content"></div>
        
        <div id="resultFileWrap" style="display:none; margin-top:10px;">
          <div id="resultFileSize" style="font-size:12.5px; color:#64748b; margin-bottom:8px;">体积：0 MB</div>
          <button id="resultDownloadBtn" class="btn-send" style="padding:11px; font-size:14.5px;">⬇️ 高速下载文件</button>
        </div>
      </div>

      <!-- 底部切换栏 -->
      <div class="bottom-bar-actions">
        <div class="footer-toggle-link" onclick="toggleView('send')">需要发件？点击这里</div>
        <span style="color:#cbd5e1;">|</span>
        <div class="history-link-btn" onclick="openHistoryModal()">📜 发件记录</div>
      </div>
    </div>
  </div>

  <!-- 📜 发件记录抽屉卡片 -->
  <div id="historyModal" class="history-modal-overlay">
    <div class="history-card">
      <div class="history-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <h3 style="font-size:17px; font-weight:800; color:#1e293b;">📜 我的发件记录</h3>
          <span id="historyCountBadge" style="font-size:11px; font-weight:700; color:#6366f1; background:#eef2ff; padding:2px 6px; border-radius:6px;">共 0 条</span>
        </div>
        <button onclick="closeHistoryModal()" style="font-size:20px; color:#64748b; padding:4px;">&times;</button>
      </div>

      <!-- 🔍 历史搜索框 -->
      <input type="text" id="historySearchInput" class="history-search-input" placeholder="🔍 快速搜索历史 (取件码 / 文件名)..." oninput="handleHistorySearch()">

      <div class="history-list-box" id="historyListContainer"></div>
      
      <button onclick="clearAllHistory()" style="padding:10px; border-radius:10px; background:#fee2e2; color:#dc2626; font-size:13px; font-weight:700; width:100%; transition:0.2s;">🗑️ 清空所有发件记录</button>
    </div>
  </div>

  <!-- 传输进度 Toast -->
  <div id="transfer-toast">
    <div style="font-size:12px; font-weight:700; display:flex; justify-content:space-between;">
      <span id="transferTaskName">🚀 准备传输...</span>
      <span id="transferPercent">0%</span>
    </div>
    <div class="transfer-bar-bg"><div id="transferBarFill" class="transfer-bar-fill"></div></div>
    <div style="font-size:11px; color:var(--text-muted); display:flex; justify-content:space-between;">
      <span id="transferSpeed">⚡ 0 KB/s</span>
      <span id="transferSize">0 MB / 0 MB</span>
    </div>
  </div>

  <script>
    const API_URL = "";
    let currentMode = "file";
    let currentSelectedFile = null;

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function toggleView(target) {
      document.getElementById('sendView').style.display = target === 'send' ? 'block' : 'none';
      document.getElementById('pickupView').style.display = target === 'pickup' ? 'block' : 'none';
    }

    function switchSendTab(type) {
      currentMode = type;
      document.getElementById('tabSendFile').classList.toggle('active', type === 'file');
      document.getElementById('tabSendText').classList.toggle('active', type === 'text');
      document.getElementById('fileAreaWrap').style.display = type === 'file' ? 'block' : 'none';
      document.getElementById('textInputArea').style.display = type === 'text' ? 'block' : 'none';
    }

    function handleExpireUnitChange() {
      const unit = document.getElementById('expireUnitSelect').value;
      const wrap = document.getElementById('expireValueInputWrap');
      const suffix = document.getElementById('expireUnitSuffix');
      const input = document.getElementById('expireValueInput');

      if (unit === 'forever') {
        wrap.style.display = 'none';
      } else {
        wrap.style.display = 'block';
        if (unit === 'day') { suffix.innerText = '天'; input.value = 1; }
        if (unit === 'hour') { suffix.innerText = '小时'; input.value = 24; }
        if (unit === 'count') { suffix.innerText = '次'; input.value = 1; }
      }
    }

    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('dragover'); }, false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('dragover'); }, false);
    });
    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      if (dt.files && dt.files.length > 0) {
        setFile(dt.files[0]);
      }
    });

    function handleFileSelected(e) {
      if (e.target.files && e.target.files.length > 0) {
        setFile(e.target.files[0]);
      }
    }

    function setFile(file) {
      if (file.size > 200 * 1024 * 1024) {
        alert("⚠️ 单文件体积不能超过 200MB！");
        return;
      }
      currentSelectedFile = file;
      document.getElementById('selectedFileName').innerText = file.name;
      document.getElementById('selectedFileSize').innerText = formatBytes(file.size);
      document.getElementById('selectedFileCard').style.display = 'flex';
      dropZone.style.display = 'none';
    }

    function clearSelectedFile() {
      currentSelectedFile = null;
      document.getElementById('hiddenFileInput').value = "";
      document.getElementById('selectedFileCard').style.display = 'none';
      dropZone.style.display = 'flex';
    }

    // ==========================================
    // 📜 发件记录管理（增、删、查）
    // ==========================================
    function getHistory() {
      return JSON.parse(localStorage.getItem('sun_box_sent_history') || '[]');
    }

    function saveSentRecord(record) {
      let history = getHistory();
      history.unshift(record);
      if (history.length > 100) history = history.slice(0, 100);
      localStorage.setItem('sun_box_sent_history', JSON.stringify(history));
    }

    function openHistoryModal() {
      document.getElementById('historySearchInput').value = "";
      renderHistoryList(getHistory());
      document.getElementById('historyModal').classList.add('active');
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').classList.remove('active');
    }

    function renderHistoryList(list) {
      const container = document.getElementById('historyListContainer');
      const countBadge = document.getElementById('historyCountBadge');
      countBadge.innerText = `共 ${list.length} 条`;

      if (list.length === 0) {
        container.innerHTML = '<p style="color:#64748b; font-size:13px; text-align:center; padding:30px 0;">暂无相关发件记录</p>';
        return;
      }

      let html = '';
      list.forEach((item, index) => {
        html += `
          <div class="history-item">
            <div style="flex:1; min-width:0; margin-right:10px;">
              <div style="display:flex; align-items:center; gap:6px; margin-bottom:3px;">
                <span class="history-code-tag" onclick="copyHistoryCode('${item.code}')" title="点击复制取件码">📋 ${item.code}</span>
                <span style="font-size:14px; font-weight:700; color:#1e293b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name}</span>
              </div>
              <div style="font-size:11.5px; color:#64748b;">
                ${new Date(item.time).toLocaleDateString()} | ${item.type === 'file' ? formatBytes(item.size) : '文本便签'}
              </div>
            </div>
            <button class="btn-delete-single" onclick="deleteHistoryItem('${item.code}')" title="删除此条记录">✕ 移除</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // 单条删除
    function deleteHistoryItem(code) {
      let history = getHistory().filter(item => item.code !== code);
      localStorage.setItem('sun_box_sent_history', JSON.stringify(history));
      handleHistorySearch(); // 刷新当前搜索视图
    }

    // 历史搜索过滤
    function handleHistorySearch() {
      const query = document.getElementById('historySearchInput').value.trim().toLowerCase();
      const allHistory = getHistory();
      if (!query) {
        renderHistoryList(allHistory);
        return;
      }
      const filtered = allHistory.filter(item => 
        (item.code || '').toLowerCase().includes(query) || 
        (item.name || '').toLowerCase().includes(query)
      );
      renderHistoryList(filtered);
    }

    function copyHistoryCode(code) {
      navigator.clipboard.writeText(code).then(() => alert(`📋 取件码【${code}】已复制到剪贴板！`));
    }

    function clearAllHistory() {
      if (confirm("⚠️ 确定要清空本地所有发件记录吗？")) {
        localStorage.removeItem('sun_box_sent_history');
        openHistoryModal();
      }
    }

    // 提交发件
    async function submitSendBox() {
      const sendKey = document.getElementById('sendAuthKey').value.trim() || localStorage.getItem('panSendKey') || "";
      if (!sendKey) { alert("⚠️ 请输入发件授权口令！"); return; }
      localStorage.setItem('panSendKey', sendKey);

      const unit = document.getElementById('expireUnitSelect').value;
      const val = parseInt(document.getElementById('expireValueInput').value) || 1;

      let expireHours = 24;
      let maxDownloads = 0;

      if (unit === 'day') expireHours = val * 24;
      else if (unit === 'hour') expireHours = val;
      else if (unit === 'count') { expireHours = 72; maxDownloads = val; }
      else if (unit === 'forever') expireHours = 0;

      if (currentMode === 'text') {
        const content = document.getElementById('textInputArea').value.trim();
        if (!content) { alert("⚠️ 请输入要发送的文本！"); return; }

        const res = await fetch(`${API_URL}/api/box/create`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-send-auth": sendKey },
          body: JSON.stringify({ type: 'text', name: '口令便签', text: content, expireHours, maxDownloads })
        });
        const json = await res.json();
        if (!json.success) { alert("❌ " + json.error); return; }

        saveSentRecord({ code: json.code, name: '口令便签', type: 'text', time: Date.now() });
        prompt("🎉 寄送成功！专属 5 位取件码：", json.code);
        document.getElementById('textInputArea').value = "";
      } else {
        if (!currentSelectedFile) { alert("⚠️ 请点击或拖入要发送的文件！"); return; }
        await uploadLargeBoxFile(currentSelectedFile, expireHours, maxDownloads, sendKey);
        clearSelectedFile();
      }
    }

    // 3 线程并发分片极速直传 (200MB+)
    async function uploadLargeBoxFile(file, expireHours, maxDownloads, sendKey) {
      const toast = document.getElementById('transfer-toast');
      const taskName = document.getElementById('transferTaskName');
      const percentText = document.getElementById('transferPercent');
      const barFill = document.getElementById('transferBarFill');
      const speedText = document.getElementById('transferSpeed');
      const sizeText = document.getElementById('transferSize');
      toast.classList.add('show');

      taskName.innerText = `📤 并发传送: ${file.name}`;
      const CHUNK_SIZE = 10 * 1024 * 1024;
      const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

      const initRes = await fetch(`${API_URL}/api/box/init-multipart`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-send-auth": sendKey },
        body: JSON.stringify({ filename: file.name, size: file.size, expireHours, maxDownloads })
      });
      const initJson = await initRes.json();
      if (!initJson.success) { alert("❌ 上传初始化失败：" + initJson.error); toast.classList.remove('show'); return; }

      const { uploadId, r2Key, code } = initJson;
      const uploadedParts = new Array(totalChunks);
      let completedChunks = 0;
      let lastLoaded = 0, lastTime = Date.now();

      const chunkIndexes = Array.from({ length: totalChunks }, (_, i) => i);
      const CONCURRENCY = 3;

      async function uploadWorker() {
        while (chunkIndexes.length > 0) {
          const i = chunkIndexes.shift();
          const start = i * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, file.size);
          const chunkBlob = file.slice(start, end);
          const partNumber = i + 1;

          const partRes = await fetch(`${API_URL}/api/box/upload-part?r2Key=${encodeURIComponent(r2Key)}&uploadId=${uploadId}&partNumber=${partNumber}`, {
            method: "POST",
            headers: { "x-send-auth": sendKey },
            body: chunkBlob
          });
          const partJson = await partRes.json();
          if (!partJson.success) throw new Error("分片中断");
          uploadedParts[i] = { partNumber, etag: partJson.etag };

          completedChunks++;
          const currentLoaded = Math.min(completedChunks * CHUNK_SIZE, file.size);
          const now = Date.now();
          const diff = (now - lastTime) / 1000;
          if (diff >= 0.2) {
            const speed = (currentLoaded - lastLoaded) / diff;
            speedText.innerText = `⚡ ${formatBytes(speed)}/s`;
            lastLoaded = currentLoaded;
            lastTime = now;
          }
          const percent = Math.floor((completedChunks / totalChunks) * 100);
          percentText.innerText = `${percent}%`;
          barFill.style.width = `${percent}%`;
          sizeText.innerText = `${formatBytes(currentLoaded)} / ${formatBytes(file.size)}`;
        }
      }

      try {
        await Promise.all(Array.from({ length: Math.min(CONCURRENCY, totalChunks) }, uploadWorker));
      } catch (err) {
        alert("❌ 上传出错：" + err.message);
        toast.classList.remove('show');
        return;
      }

      await fetch(`${API_URL}/api/box/complete-multipart`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-send-auth": sendKey },
        body: JSON.stringify({ r2Key, uploadId, parts: uploadedParts, code })
      });

      percentText.innerText = `100%`;
      barFill.style.width = `100%`;
      speedText.innerText = `✅ 寄送完成！`;
      setTimeout(() => toast.classList.remove('show'), 2000);

      saveSentRecord({ code, name: file.name, type: 'file', size: file.size, time: Date.now() });
      prompt("🎉 文件已存入快递柜！专属 5 位取件码：", code);
    }

    // 取件提取
    async function executePickup(forcedCode) {
      const code = (forcedCode || document.getElementById('pickupCodeInput').value).trim().toUpperCase();
      if (!code) { alert("⚠️ 请输入 5 位取件码！"); return; }
      document.getElementById('pickupCodeInput').value = code;

      const resultArea = document.getElementById('pickupResultArea');
      const titleEl = document.getElementById('resultTitle');
      const typeBadge = document.getElementById('resultTypeBadge');
      const expireBadge = document.getElementById('resultExpireBadge');
      const textWrap = document.getElementById('resultTextWrap');
      const fileWrap = document.getElementById('resultFileWrap');
      const fileSizeEl = document.getElementById('resultFileSize');
      const dlBtn = document.getElementById('resultDownloadBtn');

      try {
        const res = await fetch(`${API_URL}/api/box/get?code=${encodeURIComponent(code)}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error || "取件码不存在或已销毁");

        const data = json.data;
        resultArea.style.display = 'block';
        titleEl.innerText = data.name;
        expireBadge.innerText = data.expireAt ? `有效期至：${new Date(data.expireAt).toLocaleString()}` : "🔒 永久保存";

        if (data.type === 'text') {
          typeBadge.innerText = "📝 纯文本便签";
          textWrap.style.display = 'block';
          fileWrap.style.display = 'none';
          textWrap.innerText = data.text;
        } else {
          typeBadge.innerText = "📄 文件附件";
          textWrap.style.display = 'none';
          fileWrap.style.display = 'block';
          fileSizeEl.innerText = `文件体积：${formatBytes(data.size)}`;
          dlBtn.onclick = () => {
            const dlUrl = `${API_URL}/api/download?key=${encodeURIComponent(data.r2Key)}&boxCode=${code}`;
            const a = document.createElement('a');
            a.href = dlUrl;
            a.download = data.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          };
        }
      } catch (e) {
        alert("❌ " + e.message);
        resultArea.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlCode = urlParams.get('code') || window.location.hash.replace('#', '');
      if (urlCode && urlCode.length >= 4) {
        toggleView('pickup');
        executePickup(urlCode);
      }
    });
  </script>
</body>
